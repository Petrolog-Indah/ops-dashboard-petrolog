name: CI/CD Deploy Ops Dashboard (Full Pipeline)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  VPS_PROJECT_PATH: /home/contributor/ops-dashboard-petrolog
  BACKUP_PATH: /home/contributor/ops-dashboard-petrolog-backup

jobs:
  # ===========================================================================
  # STAGE 1: CHECKS - Install, Lint, Build
  # ===========================================================================
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

  # ===========================================================================
  # STAGE 2: DEPLOY
  # ===========================================================================
  deploy:
    runs-on: self-hosted
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with backup + rollback
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_HISTORICAL_API_URL: ${{ secrets.VITE_HISTORICAL_API_URL }}
          VITE_P2H_URL: ${{ secrets.VITE_P2H_URL }}
          VITE_P2H_API_KEY: ${{ secrets.VITE_P2H_API_KEY }}
        run: |
          set -e

          echo "Creating backup..."
          rm -rf ${{ env.BACKUP_PATH }}
          cp -r ${{ env.VPS_PROJECT_PATH }} ${{ env.BACKUP_PATH }} 2>/dev/null || true

          echo "Stopping old containers..."
          cd ${{ env.VPS_PROJECT_PATH }}
          docker compose down --remove-orphans 2>/dev/null || true
          docker rm -f ops-dashboard ops-dashboard-petrolog-ops-dashboard 2>/dev/null || true

          echo "Cleaning old files..."
          find ${{ env.VPS_PROJECT_PATH }} -mindepth 1 -maxdepth 1 \
            ! -name '.env' \
            -exec rm -rf {} +

          echo "Sync latest code..."
          tar -cf - \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            -C ${{ github.workspace }} . | tar -xf - -C ${{ env.VPS_PROJECT_PATH }}

          echo "Creating .env file..."
          printf '%s\n' \
            "VITE_API_URL=${VITE_API_URL}" \
            "VITE_HISTORICAL_API_URL=${VITE_HISTORICAL_API_URL}" \
            "VITE_P2H_URL=${VITE_P2H_URL}" \
            "VITE_P2H_API_KEY=${VITE_P2H_API_KEY}" \
            > ${{ env.VPS_PROJECT_PATH }}/.env

          echo "Deploying..."
          cd ${{ env.VPS_PROJECT_PATH }}
          docker compose up -d --build

          docker image prune -f

  # ===========================================================================
  # STAGE 3: VERIFY
  # ===========================================================================
  verify:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait and verify app
        run: |
          for i in {1..10}; do
            echo "Checking application..."
            curl -f https://ops.petrolog.my.id && exit 0
            sleep 10
          done
          echo "Health check failed"
          exit 1
